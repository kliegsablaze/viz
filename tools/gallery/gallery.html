<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viz Scene Gallery</title>
<style>
:root {
  --bg: #0d0d10; --panel: #17171c; --line: #2a2a33; --text: #e9e9ef; --dim: #8b8b98;
  --pad-off: #1c1c22; --keep: #3ddc84; --maybe: #f5c542; --drop: #ff5a5a; --accent: #7aa7ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px;
  align-items: center; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 18px; font-weight: 600; }
header .hint { color: var(--dim); flex: 1 1 300px; }
button { font: inherit; color: var(--text); background: #24242c; border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: #444; }
button.on { background: var(--accent); color: #000; border-color: var(--accent); }
.top { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 16px; padding: 16px; }
@media (max-width: 860px) { .top { grid-template-columns: 1fr; } }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.stage canvas { width: 100%; height: auto; display: block; }
.stage h2 { margin: 12px 0 4px; font-size: 20px; }
.stage p { margin: 0; color: var(--dim); }
.uses { margin-top: 8px; font-size: 12px; color: var(--dim); }
.uses b { color: var(--text); font-weight: 600; }
.knobs { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.knobs h3 { margin: 4px 0 10px; font-size: 13px; color: var(--dim); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
.knob { display: grid; grid-template-columns: 64px minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 6px 0;
  border-top: 1px solid var(--line); }
.knob:first-of-type { border-top: 0; }
.knob .lab { font-weight: 700; letter-spacing: .04em; }
.knob .what { grid-column: 1 / -1; color: var(--dim); font-size: 12px; margin-top: -4px; }
.knob .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
.knob input { width: 100%; accent-color: var(--accent); }
.transport { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--line); }
.transport label { color: var(--dim); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 0 16px 16px; }
.tile { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; }
.tile.sel { border-color: var(--accent); }
.tile.keep { box-shadow: inset 0 0 0 2px var(--keep); }
.tile.maybe { box-shadow: inset 0 0 0 2px var(--maybe); }
.tile.drop { opacity: .45; }
.tile canvas { width: 100%; height: auto; display: block; }
.tile .name { font-weight: 600; margin-top: 6px; display: flex; justify-content: space-between; }
.tile .new { font-size: 10px; background: var(--accent); color: #000; border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: 2px; }
.tile .num { color: var(--dim); font-weight: 400; }
.tile .desc { color: var(--dim); font-size: 12px; min-height: 34px; }
.verdict { display: flex; gap: 6px; margin-top: 8px; }
.verdict button { flex: 1; padding: 4px 0; font-size: 12px; }
.verdict button.k.on { background: var(--keep); border-color: var(--keep); color: #000; }
.verdict button.m.on { background: var(--maybe); border-color: var(--maybe); color: #000; }
.verdict button.d.on { background: var(--drop); border-color: var(--drop); color: #000; }
.summary { margin: 0 16px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.summary pre { white-space: pre-wrap; margin: 8px 0; color: var(--text); font: 13px/1.5 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<header>
  <h1>Viz Scene Gallery</h1>
  <div class="hint">Click a scene to see it big. The knobs change every scene at once, so you can see what each one does. Mark each scene Keep, Maybe or Drop.</div>
  <button id="sound">Sound on</button>
</header>

<div class="top">
  <div class="stage">
    <canvas id="big" width="440" height="440"></canvas>
    <h2 id="bigName"></h2>
    <p id="bigDesc"></p>
    <div class="uses" id="bigUses"></div>
  </div>
  <div class="knobs" id="knobs">
    <h3>Look page: the eight knobs</h3>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="summary">
  <b>Your picks</b> (this text updates as you mark scenes)
  <pre id="picks"></pre>
  <button id="copy">Copy picks</button>
</div>

<script>
"use strict";
/* ---------------- music: a 120 BPM loop, the same one the lights follow ---------------- */
let BPM = 120;
const BAR = 4;
// 8-bar song: bars 0-5 full groove (bar 3 has a snare fill), bars 6-7 a breakdown with no kick.
function hitsAt(n16) {
  const bar = Math.floor(n16 / 16) % 8, s = n16 % 16, brk = bar >= 6;
  const kick = !brk && (s % 4 === 0 || (bar % 4 === 3 && s === 14));
  const snare = !brk && (s === 4 || s === 12 || (bar % 4 === 3 && s >= 13));
  const hat = brk ? s % 4 === 2 : s % 2 === 0 || s % 4 === 3;
  const bass = !brk && [0, 3, 6, 10].includes(s);
  return { kick, snare, hat, bass, brk };
}

/* ---------------- clock ---------------- */
let t0 = performance.now(), actx = null, aStart = 0, master = null;
function beatsNow() {
  if (actx && actx.state === "running") return (actx.currentTime - aStart) * BPM / 60;
  return (performance.now() - t0) / 1000 * BPM / 60;
}

/* ---------------- sound (WebAudio drum machine) ---------------- */
let noiseBuf = null, sched16 = 0, schedTimer = null;
function startSound() {
  const keep = beatsNow();
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  aStart = actx.currentTime + 0.05 - keep * 60 / BPM;   // keep the visual clock continuous
  sched16 = Math.ceil(keep * 4);
  schedTimer = setInterval(schedule, 25);
}
function stopSound() { clearInterval(schedTimer); const b = beatsNow(); actx.close(); actx = null; t0 = performance.now() - b * 60000 / BPM; }
function schedule() {
  const ahead = actx.currentTime + 0.12;
  while (true) {
    const t = aStart + sched16 * 15 / BPM;
    if (t > ahead) break;
    if (t >= actx.currentTime - 0.01) play(hitsAt(sched16), t, sched16);
    sched16++;
  }
}
function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.001, t + dec); }
function noise(t, dur, type, freq, peak) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = actx.createGain(); env(g, t, 0.001, peak, dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
function play(h, t, n16) {
  if (h.kick) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    env(g, t, 0.002, 1.0, 0.35); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.4);
  }
  if (h.snare) { noise(t, 0.18, "bandpass", 1800, 0.5); }
  if (h.hat) noise(t, 0.05, "highpass", 8000, 0.18);
  if (h.bass) {
    const notes = [41, 41, 44, 39], bar = Math.floor(n16 / 16) % 4;
    const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = "sawtooth"; o.frequency.value = 440 * Math.pow(2, (notes[bar] - 69) / 12);
    f.type = "lowpass"; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(150, t + 0.2);
    env(g, t, 0.005, 0.28, 0.25); o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
  }
  if (n16 % 32 === 0) {               // a soft chord every two bars
    [57, 60, 64].forEach((m) => {
      const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle";
      o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t + 0.3);
      g.gain.linearRampToValueAtTime(0, t + 3.8); o.connect(g); g.connect(master); o.start(t); o.stop(t + 4);
    });
  }
}

/* ---------------- what the lights hear (the same features Viz's listener gives) ---------------- */
const feat = { kick: 0, snare: 0, hat: 0, bass: 0, kickCount: 0, bands: new Float32Array(8),
  last16: -1, kickNow: false, snareNow: false, hatNow: false, log: [] };
function listen(beats, dt) {
  const n16 = Math.floor(beats * 4);
  feat.kickNow = feat.snareNow = feat.hatNow = false;
  if (n16 !== feat.last16) {
    for (let k = feat.last16 < 0 ? n16 : feat.last16 + 1; k <= n16; k++) {
      const h = hitsAt(k);
      if (h.kick) { feat.kick = 1; feat.kickNow = true; feat.kickCount++; }
      if (h.snare) { feat.snare = 1; feat.snareNow = true; }
      if (h.hat) { feat.hat = 1; feat.hatNow = true; }
      if (h.bass) feat.bass = 1;
      feat.log[k % 64] = h;
    }
    feat.last16 = n16;
  }
  feat.kick *= Math.exp(-dt / 0.14); feat.snare *= Math.exp(-dt / 0.12);
  feat.hat *= Math.exp(-dt / 0.04); feat.bass *= Math.exp(-dt / 0.18);
  const w = [[1, .7, .2, 0, 0, 0, 0, 0], [.3, .9, .7, .2, 0, 0, 0, 0], [0, 0, .2, .5, .9, .7, .3, 0], [0, 0, 0, 0, .1, .4, .8, 1]];
  const src = [feat.kick, feat.bass, feat.snare, feat.hat];
  for (let b = 0; b < 8; b++) {
    let v = 0.08 + 0.05 * Math.sin(beats * 1.7 + b);
    for (let i = 0; i < 4; i++) v += w[i][b] * src[i];
    const target = Math.min(1, v);
    feat.bands[b] += (target - feat.bands[b]) * (target > feat.bands[b] ? 0.6 : 0.12);
  }
}

/* ---------------- the eight knobs ---------------- */
const PALETTES = {
  Ice:    [[0, 90, 255], [0, 220, 255], [190, 240, 255]],
  Fire:   [[255, 25, 0], [255, 130, 0], [255, 225, 40]],
  Acid:   [[110, 255, 0], [255, 0, 190], [0, 255, 220]],
  Sunset: [[255, 0, 110], [255, 120, 0], [140, 0, 255]],
  Mint:   [[0, 255, 110], [0, 150, 255], [210, 255, 235]],
  Royal:  [[120, 0, 255], [255, 185, 0], [0, 70, 255]],
  Candy:  [[255, 70, 170], [60, 200, 255], [255, 235, 70]],
  Mono:   [[255, 255, 255], [140, 140, 150], [70, 70, 80]],
  Rainbow: null,
};
const KNOBS = [
  { key: "scene", label: "SCENE", what: "Which picture.", opts: null, def: 0 },
  { key: "color", label: "COLOR", what: "The set of three colours every scene paints with.", opts: Object.keys(PALETTES), def: 2 },
  { key: "rate", label: "RATE", what: "How fast it steps, locked to the beat: one step per bar, half, beat, 8th or 16th.", opts: ["1 bar", "1/2", "1/4", "1/8", "1/16"], def: 2 },
  { key: "size", label: "SIZE", what: "How big or thick the shapes are, in pads.", opts: ["1", "2", "3", "4"], def: 1 },
  { key: "trail", label: "TRAIL", what: "How long lights linger after they move on. Off is hard-edged.", opts: ["Off", "Short", "Medium", "Long", "Smear"], def: 1 },
  { key: "mirror", label: "MIRROR", what: "Folds the picture: left/right, top/bottom, four ways or eight ways (kaleidoscope).", opts: ["Off", "Sides", "Top", "Four", "Eight"], def: 0 },
  { key: "shift", label: "SHIFT", what: "When the colours swap places: never, every bar, every beat, or on every kick.", opts: ["Hold", "Bar", "Beat", "Kick"], def: 1 },
  { key: "react", label: "REACT", what: "What a kick does: nothing, brighten, grow the shapes, flash the grid, or flip lit and dark.", opts: ["Off", "Glow", "Grow", "Flash", "Flip"], def: 1 },
];

/* ---------------- scenes ---------------- */
// Every scene draws into an 8x8 grid (x left to right, y top to bottom) with g.set(x, y, colour 0-2, amount 0-1).
// c.step counts steps at RATE, c.f is how far through the current step, c.s is SIZE (1-4).
const C = 3.5;
const cheb = (x, y) => Math.max(Math.abs(x - C), Math.abs(y - C));
const manh = (x, y) => Math.abs(x - C) + Math.abs(y - C);
const tri = (n, m) => { const p = n % (2 * m); return p < m ? p : 2 * m - p; };
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }
function ringPath(k) { const lo = 3 - k, hi = 4 + k, p = [];
  for (let x = lo; x <= hi; x++) p.push([x, lo]); for (let y = lo + 1; y <= hi; y++) p.push([hi, y]);
  for (let x = hi - 1; x >= lo; x--) p.push([x, hi]); for (let y = hi - 1; y > lo; y--) p.push([lo, y]); return p; }
function each(fn) { for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) fn(x, y); }

const SCENES = [
  { name: "Pulse", uses: "RATE SIZE", desc: "The whole grid (or a centre square at smaller SIZE) flashes on every step and fades.",
    draw(g, c) { const a = Math.pow(1 - c.f, 1.6), r = c.s === 4 ? 9 : c.s;
      each((x, y) => { if (cheb(x, y) < r) g.set(x, y, c.step % 2, a); }); } },
  { name: "Rings", uses: "RATE SIZE", desc: "A square ring bursts out from the centre on every step.",
    draw(g, c) { const r = Math.floor(c.f * 4);
      each((x, y) => { const d = Math.floor(cheb(x, y)); if (d <= r && d > r - c.s) g.set(x, y, c.step % 3, 1); }); } },
  { name: "Diamond", uses: "RATE SIZE", desc: "A diamond ripples out from the centre on every step.",
    draw(g, c) { const r = 1 + Math.floor(c.f * 7);
      each((x, y) => { const d = manh(x, y); if (d <= r && d > r - c.s) g.set(x, y, c.step % 3, 1); }); } },
  { name: "Burst", uses: "SIZE", desc: "Each kick and snare sets off a ring from a random pad. The kick's rings come from near the centre.",
    init(st) { st.b = []; st.r = rng(7); },
    draw(g, c, st) {
      if (c.kick) st.b.push({ x: 2.5 + st.r() * 2, y: 2.5 + st.r() * 2, t: c.time, ci: 0 });
      if (c.snare) st.b.push({ x: st.r() * 8, y: st.r() * 8, t: c.time, ci: 1 + (st.b.length % 2) });
      st.b = st.b.filter((b) => (c.time - b.t) < 1.2);
      for (const b of st.b) { const r = (c.time - b.t) * 12;
        each((x, y) => { const d = Math.hypot(x + .5 - b.x, y + .5 - b.y); if (Math.abs(d - r) < c.s * .5 + .25) g.set(x, y, b.ci, 1); }); } } },
  { name: "Sweep", uses: "RATE SIZE", desc: "A bar sweeps back and forth, one pad per step. It turns sideways every other pass.",
    draw(g, c) { const p = tri(c.step, 8 - c.s), vert = Math.floor(c.step / (2 * (8 - c.s))) % 2;
      each((x, y) => { const v = vert ? y : x; if (v >= p && v < p + c.s) g.set(x, y, Math.floor(c.step / (8 - c.s)) % 2, 1); }); } },
  { name: "Cross", uses: "RATE SIZE", desc: "A plus sign and an X take turns, one per step.",
    draw(g, c) { const s = Math.min(c.s, 3), plus = c.step % 2 === 0;
      each((x, y) => { const on = plus ? (Math.abs(x - C) <= s - .5 || Math.abs(y - C) <= s - .5)
        : (Math.abs(x - y) <= s - 1 || Math.abs(x + y - 7) <= s - 1); if (on) g.set(x, y, plus ? 0 : 1, 1); }); } },
  { name: "Snake", uses: "RATE SIZE", desc: "A snake spirals from the edge to the centre and back, two pads per step. SIZE sets its length.",
    init(st) { st.path = []; let x0 = 0, y0 = 0, x1 = 7, y1 = 7;
      while (x0 <= x1 && y0 <= y1) { for (let x = x0; x <= x1; x++) st.path.push([x, y0]); for (let y = y0 + 1; y <= y1; y++) st.path.push([x1, y]);
        if (y1 > y0) for (let x = x1 - 1; x >= x0; x--) st.path.push([x, y1]); if (x1 > x0) for (let y = y1 - 1; y > y0; y--) st.path.push([x0, y]);
        x0++; y0++; x1--; y1--; } },
    draw(g, c, st) { const head = Math.floor((c.step + c.f) * 2), len = c.s * 4;
      for (let i = 0; i < len; i++) { const k = tri(head - i + 128 * 4, 63); const [x, y] = st.path[k]; g.set(x, y, i === 0 ? 2 : 0, 1 - i / (len + 2)); } } },
  { name: "Radar", uses: "RATE SIZE", desc: "A hand sweeps round the centre, one turn every four steps. SIZE widens it.",
    draw(g, c) { const a = (c.step + c.f) * Math.PI / 2;
      each((x, y) => { const ang = Math.atan2(y - C, x - C); let d = (a - ang) % (2 * Math.PI); if (d < 0) d += 2 * Math.PI;
        if (d < .35 * c.s) g.set(x, y, Math.floor((c.step) / 4) % 2, 1 - d / (.35 * c.s) * .6); }); } },
  { name: "Stripes", uses: "RATE SIZE", desc: "Diagonal stripes slide across, one pad per step, like a barber's pole.",
    draw(g, c) { each((x, y) => { const v = x + y + c.step, P = 2 * c.s; if (v % P < c.s) g.set(x, y, Math.floor(v / P) % 2, 1); }); } },
  { name: "Tunnel", uses: "RATE SIZE", desc: "Nested squares zoom outward, one ring per step. SIZE spaces the rings.",
    draw(g, c) { each((x, y) => { const v = Math.floor(cheb(x, y)) - c.step, P = c.s + 1, m = ((v % P) + P) % P;
      if (m === 0) g.set(x, y, ((Math.floor(v / P) % 3) + 3) % 3, 1); }); } },
  { name: "Quads", uses: "RATE SIZE", desc: "The four quarters light in turn, clockwise, one per step. Small SIZE lights just the middle of each quarter.",
    draw(g, c) { const q = c.step % 4, qx = q === 1 || q === 2, qy = q >= 2;
      each((x, y) => { if ((x >= 4) === qx && (y >= 4) === qy && Math.max(Math.abs(x - C), Math.abs(y - C)) < c.s) g.set(x, y, q % 3, 1); }); } },
  { name: "Shapes", uses: "RATE SIZE", desc: "A different shape on every step: square, diamond, X, plus, ring, block.",
    draw(g, c) { const k = c.step % 6, R = .5 + c.s * .78;
      each((x, y) => { const dx = Math.abs(x - C), dy = Math.abs(y - C), ch = Math.max(dx, dy), mh = dx + dy, e = Math.hypot(dx, dy); let on;
        if (k === 0) on = ch <= R && ch > R - 1; else if (k === 1) on = mh <= R * 1.6 && mh > R * 1.6 - 1;
        else if (k === 2) on = Math.abs(dx - dy) < .5 && ch <= R; else if (k === 3) on = (dx < .6 || dy < .6) && ch <= R;
        else if (k === 4) on = Math.abs(e - R) < .55; else on = ch <= R;
        if (on) g.set(x, y, k % 3, 1); }); } },
  { name: "Steps", uses: "(follows the bar)", desc: "The 16 steps of the bar as 16 blocks. The current step is bright; kicks leave a mark.",
    draw(g, c) { const n = Math.floor(c.beats * 4), cur = n % 16, base = n - cur;
      for (let i = 0; i < 16; i++) { const bx = (i % 4) * 2, by = Math.floor(i / 4) * 2, h = feat.log[(base + i) % 64];
        let ci = -1, a = 0; if (i === cur) { ci = 0; a = 1; } else if (i < cur && h && h.kick) { ci = 1; a = .8; } else if (i < cur) { ci = 2; a = .15; }
        if (ci >= 0) for (let k = 0; k < 4; k++) g.set(bx + (k % 2), by + (k >> 1), ci, a); } } },
  { name: "Rise", uses: "RATE SIZE", desc: "Rows fill from the bottom, SIZE rows per step, then the full grid flashes and it starts again.",
    draw(g, c) { const per = Math.ceil(8 / c.s), k = c.step % (per + 1);
      each((x, y) => { if (k === per) g.set(x, y, 2, 1 - c.f); else if (7 - y < (k + 1) * c.s) g.set(x, y, (7 - y) < 3 ? 0 : (7 - y) < 6 ? 1 : 2, 1); }); } },
  { name: "Bounce", uses: "RATE SIZE", desc: "A ball bounces across the grid and lands on every step.",
    draw(g, c) { const s = Math.min(c.s, 3), h = 1 - Math.pow(2 * c.f - 1, 2), top = Math.round((8 - s) * (1 - h)), lx = tri(c.step, 8 - s);
      for (let y = top; y < top + s; y++) for (let x = lx; x < lx + s; x++) g.set(x, y, c.step % 3, 1); } },
  { name: "Wave", uses: "RATE SIZE", desc: "A sine wave rolls across. The bass makes it taller.",
    draw(g, c) { const A = 1.2 + 2.3 * feat.bass, ph = (c.step + c.f) * Math.PI / 2;
      each((x, y) => { const yc = C + A * Math.sin(x * Math.PI / 4 + ph); if (Math.abs(y - yc) < c.s * .5 + .1) g.set(x, y, Math.abs(y - yc) < .5 ? 1 : 0, 1); }); } },
  { name: "Rain", uses: "RATE SIZE", desc: "Drops fall down the columns. More drops on every hi-hat; SIZE sets how many.",
    init(st) { st.d = []; st.r = rng(3); },

/* ---------------- engine: palette, mirror, react, trail, underglow ---------------- */
const knob = {}; KNOBS.forEach((k) => (knob[k.key] = k.def));
function hsv(h) { h = ((h % 1) + 1) % 1; const i = Math.floor(h * 6), f = h * 6 - i, q = 1 - f;
  return [[1, f, 0], [q, 1, 0], [0, 1, f], [0, q, 1], [f, 0, 1], [1, 0, q]][i].map((v) => v * 255); }

  const p = PALETTES[KNOBS[1].opts[knob.color]];

  return p[(ci + sh) % 3];

const RATES = [0.25, 0.5, 1, 2, 4], TRAILS = [0, 0.06, 0.15, 0.35, 0.9];

  constructor(sceneIndex, canvas) {

  setScene(i) { this.sc = SCENES[i]; this.st = {}; if (this.sc.init) this.sc.init(this.st); this.disp.fill(0); }

      const col = colourOf(ci, x, y, sh), k = (y * 8 + x) * 3;
      for (let j = 0; j < 3; j++) cur[k + j] = Math.max(cur[k + j], col[j] * Math.min(1, a)); } };
    this.sc.draw(g, c, this.st);

      if ((m === 2 || m >= 3) && sy > 3) sy = 7 - sy;

    g.fillStyle = "#08080a"; g.fillRect(0, 0, W, W);
    const rgb = (k, s = 1) => { const f = (v) => Math.round(Math.min(255, v * s)); return [f(d[k]), f(d[k + 1]), f(d[k + 2])]; };
    const css = (c) => (c[0] + c[1] + c[2] < 12 ? null : `rgb(${c[0]},${c[1]},${c[2]})`);
    const gap = cell * .1, rad = cell * .14;
    // underglow: each edge light takes the colour of the pad beside it
    for (let i = 0; i < 8; i++) {
      const pos = cell * (1 + i) + gap;
      const sides = [[pos, cell * .55, (0 * 8 + i) * 3], [pos, cell * 9.1, (7 * 8 + i) * 3], [cell * .55, pos, (i * 8) * 3], [cell * 9.1, pos, (i * 8 + 7) * 3]];
      for (const [x, y, k] of sides) { const c = css(rgb(k, .8)); g.fillStyle = c || "#141418";
        const horiz = y === cell * .55 || y === cell * 9.1; g.fillRect(x, y, horiz ? cell - 2 * gap : cell * .35, horiz ? cell * .35 : cell - 2 * gap); }
    }
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      const c = css(rgb((y * 8 + x) * 3)), px = cell * (1 + x) + gap, py = cell * (1 + y) + gap, s = cell - 2 * gap;
      g.fillStyle = c || PAD_OFF;
      g.beginPath(); g.roundRect(px, py, s, s, rad); g.fill();
    }
  }
}

/* ---------------- page ---------------- */
let verdicts = {};
try { verdicts = JSON.parse(localStorage.getItem("viz-gallery-verdicts") || "{}"); } catch (e) { verdicts = {}; }
function saveVerdicts() { try { localStorage.setItem("viz-gallery-verdicts", JSON.stringify(verdicts)); } catch (e) {} }

const big = new Player(0, document.getElementById("big"));
const tiles = [];
const grid = document.getElementById("grid");
SCENES.forEach((sc, i) => {
  const el = document.createElement("div"); el.className = "tile";
  el.innerHTML = `<canvas width="200" height="200"></canvas><div class="name"><span>${sc.name}${sc.fresh ? ' <span class="new">NEW</span>' : ""}</span><span class="num">${i + 1}</span></div>
    <div class="desc">${sc.desc}</div><div class="verdict"><button class="k">Keep</button><button class="m">Maybe</button><button class="d">Drop</button></div>`;
  grid.appendChild(el);
  const p = new Player(i, el.querySelector("canvas")); tiles.push({ el, p });
  el.addEventListener("click", (e) => { if (e.target.tagName !== "BUTTON") setKnob("scene", i); });
  const set = (v) => { verdicts[sc.name] = verdicts[sc.name] === v ? undefined : v; saveVerdicts(); refreshVerdicts(); };
  el.querySelector(".k").onclick = () => set("keep"); el.querySelector(".m").onclick = () => set("maybe"); el.querySelector(".d").onclick = () => set("drop");
});
function refreshVerdicts() {
  const groups = { keep: [], maybe: [], drop: [], unmarked: [] };
  tiles.forEach(({ el }, i) => { const v = verdicts[SCENES[i].name];
    el.classList.toggle("keep", v === "keep"); el.classList.toggle("maybe", v === "maybe"); el.classList.toggle("drop", v === "drop");
    el.querySelector(".k").classList.toggle("on", v === "keep"); el.querySelector(".m").classList.toggle("on", v === "maybe"); el.querySelector(".d").classList.toggle("on", v === "drop");
    groups[v || "unmarked"].push(SCENES[i].name); });
  document.getElementById("picks").textContent =
    `Keep: ${groups.keep.join(", ") || "-"}\nMaybe: ${groups.maybe.join(", ") || "-"}\nDrop: ${groups.drop.join(", ") || "-"}\nNot marked yet: ${groups.unmarked.join(", ") || "-"}`;
}

const knobBox = document.getElementById("knobs");
const knobEls = {};
KNOBS.forEach((k) => {
  const opts = k.opts || SCENES.map((s) => s.name);
  const row = document.createElement("div"); row.className = "knob";
  row.innerHTML = `<div class="lab">${k.label}</div><input type="range" min="0" max="${opts.length - 1}" step="1" value="${knob[k.key]}"><div class="val"></div><div class="what">${k.what}</div>`;
  knobBox.appendChild(row);
  const input = row.querySelector("input"), val = row.querySelector(".val");
  knobEls[k.key] = { input, val, opts };
  input.addEventListener("input", () => setKnob(k.key, +input.value));
});
const tr = document.createElement("div"); tr.className = "transport";
tr.innerHTML = `<label>Tempo</label><input type="range" id="bpm" min="80" max="160" step="1" value="120"><span id="bpmv">120 BPM</span>
  <span style="color:var(--dim)">The loop has a two-bar breakdown with no kick every eight bars.</span>`;
knobBox.appendChild(tr);
document.getElementById("bpm").addEventListener("input", (e) => { const b = beatsNow(); BPM = +e.target.value;
  document.getElementById("bpmv").textContent = BPM + " BPM";
  if (actx) aStart = actx.currentTime - b * 60 / BPM; else t0 = performance.now() - b * 60000 / BPM; });

function setKnob(key, v) {
  knob[key] = v; const e = knobEls[key]; e.input.value = v; e.val.textContent = e.opts[v];
  if (key === "scene") { big.setScene(v); const sc = SCENES[v];
    document.getElementById("bigName").textContent = `${v + 1}. ${sc.name}`;
    document.getElementById("bigDesc").textContent = sc.desc;
    document.getElementById("bigUses").innerHTML = `Knobs that change the shape: <b>${sc.uses}</b>. COLOR, TRAIL, MIRROR, SHIFT and REACT work on every scene.`;
    tiles.forEach(({ el }, i) => el.classList.toggle("sel", i === v)); }
}
KNOBS.forEach((k) => setKnob(k.key, knob[k.key]));
refreshVerdicts();

document.getElementById("sound").onclick = (e) => {
  if (actx) { stopSound(); e.target.textContent = "Sound on"; e.target.classList.remove("on"); }
  else { startSound(); e.target.textContent = "Sound off"; e.target.classList.add("on"); }
};
document.getElementById("copy").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(document.getElementById("picks").textContent); };

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const beats = beatsNow(), time = now / 1000;
  listen(beats, dt);
  big.frame(beats, dt, time);
  for (const t of tiles) t.p.frame(beats, dt, time);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
